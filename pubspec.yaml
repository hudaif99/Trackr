name: fluxo
description: "Fluxo — AI-assisted expense tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Dependency injection
  get_it: ^8.0.0

  # UI
  flutter_screenutil: ^5.9.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_crashlytics: ^4.0.0
  firebase_analytics: ^11.0.0
  google_sign_in: ^6.2.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  connectivity_plus: ^6.0.0
  http: ^1.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
